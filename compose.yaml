services:
  prod:
    build:
      context: .
      target: prod
    container_name: trappa_prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  dev:
    build:
      context: .
      target: build
    container_name: trappa_dev
    command: pnpm dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    restart: "no"   # 👈 Viktigt för att undvika port-låsning

  test:
    build:
      context: .
      target: build
    container_name: trappa_test
    command: pnpm test
    environment:
      NODE_ENV: test
    volumes:
      - .:/app
      - /app/node_modules